services:
  db:
    image: postgis/postgis:16-3.4
    container_name: electrimap-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: electrimap
      POSTGRES_PASSWORD: electrimap_password
      POSTGRES_DB: electrimap
    ports:
      - "5432:5432"
    volumes:
      - electrimap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electrimap -d electrimap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: electrimap-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      OFFLINE_MODE: "true"
      DATABASE_URL: postgresql+psycopg://electrimap:electrimap_password@db:5432/electrimap
      STORAGE_ROOT: /app/data/storage
      REFERENCE_DATA_ROOT: /app/data/reference
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: electrimap-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      OFFLINE_MODE: "true"
      DATABASE_URL: postgresql+psycopg://electrimap:electrimap_password@db:5432/electrimap
      STORAGE_ROOT: /app/data/storage
      REFERENCE_DATA_ROOT: /app/data/reference
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: electrimap-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  electrimap_pgdata:
