name: Bug Report
description: Create a report to help us fix a defect or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment & Logs
      description: Include relevant environment details, browser version, OS, and server logs or console errors.
      placeholder: |
        - OS: [e.g. Windows 11, Ubuntu 22.04]
        - Browser: [e.g. Chrome 122, Firefox 123]
        - Python version: [e.g. 3.12.3]
        - Node.js version: [e.g. 20.11.0]
        - Error logs:
    validations:
      required: false
